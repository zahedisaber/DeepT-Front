<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  // GitHub Pages has no server-side routing -- a direct visit or refresh on
  // /dashboard or /new-project 404s here. This redirects back to index.html
  // while preserving the intended path AND query string (e.g. a password-
  // reset link is /login/?reset_token=...) so index.html's own routing
  // (see applyRouteForPath) and its ?param handlers can take over.
  sessionStorage.setItem('deept_redirect_path', location.pathname + location.search);
  location.replace('/');
</script>
</head>
<body></body>
</html>
