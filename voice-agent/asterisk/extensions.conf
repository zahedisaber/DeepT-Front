; Dialplan: ring the human receptionist first; if nobody answers (or the office
; line is busy), the AI agent picks up. Merge into /etc/asterisk/extensions.conf.
; Needs Asterisk 18+ with app_audiosocket and func_curl loaded.

[globals]
AGENT_CONTROL=http://127.0.0.1:8090   ; deept_agent.phone.server control port
AGENT_AUDIO=127.0.0.1:9092            ; deept_agent.phone.server AudioSocket port
HUMAN_RING_SECONDS=15                 ; set to 0 to send every call straight to the agent

[from-customer]
; The dialed number (EXTEN) picks the office on the agent side. From the test
; softphone, dial 5000: the sample office's test number in offices/sample.yaml.
exten => _X.,1,NoOp(Call to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(OFFICE_NUMBER=${EXTEN})
 same => n,GotoIf($[${HUMAN_RING_SECONDS} = 0]?agent,s,1)
 same => n,Dial(PJSIP/101,${HUMAN_RING_SECONDS})
 same => n,Goto(agent,s,1)

[agent]
exten => s,1,Answer()
 same => n,Set(CALL_ID=${UUID()})
 same => n,Set(REG=${CURL(${AGENT_CONTROL}/register?uuid=${CALL_ID}&did=${OFFICE_NUMBER}&caller=${CALLERID(num)})})
 same => n,AudioSocket(${CALL_ID},${AGENT_AUDIO})
 ; The agent hung up its side: did it ask for a transfer?
 same => n,Set(RESULT=${CURL(${AGENT_CONTROL}/result?uuid=${CALL_ID})})
 same => n,GotoIf($["${CUT(RESULT,:,1)}" = "TRANSFER"]?transfer)
 same => n,Hangup()
 same => n(transfer),Dial(PJSIP/${CUT(RESULT,:,2)},30)
 same => n,Hangup()

[staff]
exten => 1001,1,Dial(PJSIP/1001,30)
