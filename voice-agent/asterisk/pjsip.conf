; Minimal PJSIP setup for testing the agent with a softphone (e.g. Zoiper on
; your mobile) before any gateway exists. Merge into /etc/asterisk/pjsip.conf.
; Change every password before exposing Asterisk to a network.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

; --- 1001: softphone that plays the "customer" -------------------------------
[1001]
type=endpoint
context=from-customer
disallow=all
allow=ulaw,alaw
auth=1001
aors=1001

[1001]
type=auth
auth_type=userpass
username=1001
password=change-me-1001

[1001]
type=aor
max_contacts=1

; --- 101: the human receptionist's phone (transfers ring here) ---------------
[101]
type=endpoint
context=staff
disallow=all
allow=ulaw,alaw
auth=101
aors=101

[101]
type=auth
auth_type=userpass
username=101
password=change-me-101

[101]
type=aor
max_contacts=1

; --- FXO gateway (the office's real landlines), for later --------------------
; Configure the gateway to send each line's calls to this Asterisk with the
; office number as the called number (e.g. 02188001234).
;[fxo-gateway]
;type=endpoint
;context=from-customer
;disallow=all
;allow=ulaw,alaw
;aors=fxo-gateway
;
;[fxo-gateway]
;type=aor
;contact=sip:192.168.1.50:5060
;
;[fxo-gateway]
;type=identify
;endpoint=fxo-gateway
;match=192.168.1.50
